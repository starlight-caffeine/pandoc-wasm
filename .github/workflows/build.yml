# GitHub Actions Workflow for pandoc-wasm
#
# This workflow:
# 1. Tests the package on pushes and PRs to the main branch
# 2. Deploys demo to GitHub Pages on pushes to main
#
# Releases are handled by release.yml when a tag is pushed.
#
# Note: The pandoc.wasm binary is downloaded during the 'prepare' step
# and included in the npm package. It is NOT committed to git.

name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Download Pandoc WASM
        run: npm run prepare

      - name: Verify WASM downloaded
        run: |
          if [ ! -f src/pandoc.wasm ]; then
            echo "Error: pandoc.wasm not found"
            exit 1
          fi
          echo "✓ pandoc.wasm found ($(du -h src/pandoc.wasm | cut -f1))"
          ls -lh src/pandoc.wasm

      - name: Run tests
        run: npm test

  deploy-pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Download Pandoc WASM
        run: npm run prepare

      - name: Prepare demo
        run: npm run setup-demo

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
